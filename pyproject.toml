[project]
name = "jevqa"
version = "0.1.0"
description = "Autonomous pre-QA bug hunter for web apps: Jev (TypeSafe) picks actions and judges screens, Claude reads the spec once."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Dmytro Tolok" }]
dependencies = ["playwright>=1.63", "requests>=2.32", "anthropic>=0.40"]
keywords = ["testing", "qa", "playwright", "monkey-testing", "typesafe", "jev"]

[project.scripts]
jevqa = "jevqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevqa"]
